<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Sin conexión · Tecvol</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f4f4f1;
        color: #1a1a1a;
        font-family: "Arial Narrow", Arial, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.5;
      }
      main {
        max-width: 26rem;
        border-top: 6px solid #747478;
        position: relative;
        padding-top: 1.5rem;
      }
      main::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 0;
        width: 5rem;
        height: 6px;
        background: #ff8929;
      }
      img {
        display: block;
        width: 4rem;
        height: 4rem;
        margin-bottom: 1.25rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        line-height: 1.1;
      }
      p {
        margin: 0 0 1.5rem;
        color: #5c5c5c;
      }
      button {
        min-height: 3.5rem;
        padding-inline: 1.75rem;
        border: 3px solid #ff8929;
        border-radius: 0.25rem;
        background: #ff8929;
        color: #1a1a1a;
        font: inherit;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover {
        border-color: #1a1a1a;
        background: #1a1a1a;
        color: #ff8929;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/android-chrome-192x192.png" alt="" width="64" height="64" />
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet en este momento. Cuando vuelva, toque el botón para cargar la página otra vez.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
